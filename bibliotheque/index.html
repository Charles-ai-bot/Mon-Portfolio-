<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque en Ligne - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="logo">Bibliothèque</h1>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="books.html">Gestion Livres</a></li>
                    <li><a href="wishlist.html">Ma Liste</a></li>
                    <li><a href="admin.html">Administration</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h2>Bienvenue dans votre bibliothèque en ligne</h2>
                <p>Découvrez, explorez et gérez votre collection de livres préférés</p>
            </div>
        </section>

        <section class="search-section">
            <h3>Rechercher un livre</h3>
            <form id="searchForm" class="search-form">
                <input type="text" id="searchQuery" name="query" placeholder="Rechercher par titre ou auteur..." required>
                <button type="submit">Rechercher</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Bibliothèque. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/auth-ui.js"></script>
</body>
</html>
